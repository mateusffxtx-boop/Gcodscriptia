name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          # Garante que a pasta public existe e o index.html está lá
          mkdir -p public
          if [ ! -f "index.html" ]; then
            echo "<(!DOCTYPE html><html><body><h1>App Default</h1></body></html>)" > public/index.html
          else
            cp index.html public/index.html
          fi

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor Config
        run: |
          npx cap init "MediaApp" "com.seuapp.media" --web-dir public

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Inject MediaProjection Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Insere as permissoes de MediaProjection logo abaixo da tag de internet
            sed -i '/<uses-permission android:name="android.permission.INTERNET"/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>' $MANIFEST
          else
            echo "Erro: AndroidManifest.xml nao encontrado!"
            exit 1
          fi

      - name: Copy Web Files to Android
        run: |
          npx cap copy android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
